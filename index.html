<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muse 2 Reader</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#111111">
<style>
  body { margin: 0; padding: 16px; background: #111; color: #eee; font: 16px system-ui, sans-serif; }
  button { font-size: 18px; padding: 12px 16px; margin: 4px 4px 4px 0; border: 0; border-radius: 8px; background: #2a5; color: #fff; }
  button.secondary { background: #345; }
  button:disabled { opacity: .4; }
  button.active { background: #2a5; outline: 3px solid #8f8; }
  #phase { min-height: 1.3em; margin: 8px 0; font-size: 24px; font-weight: bold; }
  #status, #server { margin: 6px 0; color: #aaa; }
  #contact { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0; }
  .tile { padding: 8px 4px; border-radius: 8px; background: #333; text-align: center; font-size: 13px; }
  .tile b { display: block; font-size: 20px; }
  .tile small { display: block; margin-top: 4px; font-size: 12px; }
  .good { background: #1d6b35; }
  .fair { background: #866512; }
  .bad { background: #8a2020; }
  table { width: 100%; margin: 8px 0; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td, th { padding: 4px 6px; text-align: right; border-bottom: 1px solid #333; }
  td:first-child, th:first-child { text-align: left; }
  canvas { display: block; width: 100%; margin: 8px 0; background: #000; }
  #traces { height: 260px; }
  #spectrum { height: 200px; }
  #log { max-height: 30vh; overflow: auto; color: #888; font: 12px monospace; white-space: pre-wrap; }
  h3 { margin: 16px 0 4px; font-size: 18px; }
  .rec { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 0; border-bottom: 1px solid #333; }
  .rec span { flex: 1 1 100%; color: #ccc; font-size: 14px; }
  button.small { margin: 0; padding: 8px 12px; font-size: 15px; }
  /* Meditate: the whole screen is the answer pad, dark, so it can be tapped with eyes closed. */
  #sit { position: fixed; inset: 0; z-index: 10; background: #000; color: #555; padding: 24px;
         display: flex; flex-direction: column; justify-content: space-between; touch-action: manipulation; user-select: none; }
  #sit[hidden] { display: none; }
  #sit p { margin: 0; font-size: 18px; line-height: 1.5; }
  #sit button { align-self: flex-start; background: #222; color: #777; }
</style>
</head>
<body>
<button id="connect">Connect Muse</button>
<button id="disconnect" class="secondary" disabled>Disconnect</button>
<div>
  <button id="earCheck" class="secondary">Ear check</button>
  <button class="secondary test" data-test="alpha" disabled>Alpha test (4 min)</button>
  <button class="secondary test" data-test="meditate" disabled>Meditate (20 min)</button>
  <button id="medSound" class="secondary">Sound: Silence</button>
  <button id="probes" class="secondary">Probes: off</button>
</div>
<div>
  <button class="secondary marker" data-marker="eyes_open" disabled>Eyes open</button>
  <button class="secondary marker" data-marker="eyes_closed" disabled>Eyes closed</button>
</div>
<div id="phase"></div>
<div id="status">Not connected.</div>
<div id="server"></div>
<div id="contact"></div>
<canvas id="traces" width="800" height="440"></canvas>
<table>
  <thead><tr><th>Ch</th><th>Hz</th><th>Lost</th><th>θ %</th><th>α %</th><th>β %</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<canvas id="spectrum" width="800" height="300"></canvas>
<h3>Recordings on this phone</h3>
<div id="recordings">None yet.</div>
<h3>Log</h3>
<div id="log"></div>
<div id="sit" hidden>
  <button id="sitStop" class="small">Stop</button>
  <p id="sitHelp"></p>
  <p id="sitClock"></p>
</div>
<script>
'use strict';
// Muse 2 GATT layout and start sequence, checked against muse-js and muse-lsl.
const SERVICE = 0xfe8d;
const uuid = n => `273e00${n}-4c4d-454d-96be-f03bac821358`;
const CONTROL = uuid('01');
const EEG = [['TP9', uuid('03')], ['AF7', uuid('04')], ['AF8', uuid('05')], ['TP10', uuid('06')]];
const PLACES = ['left ear', 'left forehead', 'right forehead', 'right ear'];
const FS = 256;
const BUF = 1024;  // 4 s kept for the traces
const WIN = 512;   // the last 2 s go into the spectrum: 0.5 Hz bins
const BANDS = [[4, 8], [8, 13], [13, 30]];  // theta, alpha, beta
const COLORS = ['#f6a', '#6af', '#fd5', '#5e9'];

// Contact thresholds in µV. In the first recording, ear sensors with good contact showed
// 1-3 µV of mains hum (48-52 Hz) and 5-8 µV of 20-40 Hz noise.
const RAIL = 990;  // the 12-bit range ends at about ±1000 µV
const HUM_FAIR = 10, HUM_BAD = 30;
const NOISE_FAIR = 12, NOISE_BAD = 25;
const VERDICT = ['good', 'fair', 'bad'];
const TRACE_UV = 100;  // each trace row spans ±100 µV
// During a test, a sensor that stays bad for WARN_AFTER_MS gets a soft chime on its own side:
// low notes for an ear sensor, high notes for a forehead sensor. A rising chime means all are fine again.
const WARN_AFTER_MS = 3000, WARN_EVERY_MS = 10000;
const SIDES = [-1, -1, 1, 1];
const EAR_SENSOR = [true, false, false, true];

// Pure tones per ear: the 6 Hz binaural beat and the ear check. The carrier is below 130 Hz, like most
// of the Gateway tapes' beat time. Counting each mains harmonic (50-300 Hz) as a source, no 3rd-order
// mixing of the tones with the mains comes within 1 Hz of 6 Hz, even with the mains 0.1 Hz off.
// Nearer 100 Hz that fails: on 97/103 Hz, 2 × 103 − 200 = 6 Hz.
const CARRIER = 112.5, BEAT_HZ = 6;
const SOUNDS = {
  beat: { left: [CARRIER], right: [CARRIER + BEAT_HZ] },
  left: { left: [CARRIER + BEAT_HZ / 2], right: [] },
  right: { left: [], right: [CARRIER + BEAT_HZ / 2] },
};
const TONE_GAIN = 0.2;
const FADE_S = 2;  // crossfade between sounds: a click would itself evoke a brain response
const EAR_CHECK = [
  ['left', 'LEFT ear only', 2.5], ['right', 'RIGHT ear only', 2.5],
  ['beat', 'BEAT sample, a slow wobble', 8],
];

// A test is a list of timed steps. Beeps: one means close your eyes, two mean open them, three mean done.
const TESTS = {
  alpha: {
    label: 'Alpha test (4 min)',
    steps: [
      { marker: 'eyes_open', s: 60, beeps: 2 },
      { marker: 'eyes_closed', s: 60, beeps: 1 },
      { marker: 'eyes_open', s: 60, beeps: 2 },
      { marker: 'eyes_closed', s: 60, beeps: 1 },
    ],
  },
  // Eyes closed, with the sound picked next to the button, and thought probes if they are on.
  meditate: {
    label: 'Meditate (20 min)',
    steps: [{ marker: 'meditate', s: 1200, beeps: 1, sound: 'picked' }],
  },
};
// Thought probes during Meditate: a soft bell at random moments; tap the screen once if you were
// focused, twice if your mind had wandered, three times if you were drowsy. The EEG just before each
// answer shows what those states look like on you. No probe in the first 4 min: in the first two
// sessions, settling in took about 3.5 min.
const PROBE_FIRST_S = 240, PROBE_GAP_S = [60, 150];
const PROBE_WAIT_MS = 10000;  // no tap by then: no answer
const TAP_GAP_MS = 2000;      // the answer is complete this long after the last tap
const ANSWERS = ['focused', 'wandering', 'drowsy'];
// Meditate's sounds, in the order the Sound button steps through them. Noise is a looped 20 s
// stereo buffer, different in each ear; white is flat, pink falls 3 dB per octave (softer), brown
// 6 dB per octave (a deep rumble). Each is set to the same RMS.
const MED_SOUNDS = [['', 'Silence'], ['white', 'White noise'], ['pink', 'Pink noise'], ['brown', 'Brown noise'], ['beat', '6 Hz beat']];
const NOISE_RMS = 0.1, NOISE_S = 20, PREVIEW_S = 4;
const LABELS = {
  eyes_open: 'Eyes OPEN', eyes_closed: 'Eyes CLOSED', silence: 'Silence', meditate: 'Meditate',
};

const $ = id => document.getElementById(id);
const chans = EEG.map(([name]) => ({ name, buf: new Float32Array(BUF), filled: 0 }));
let device = null, control = null, session = null, wakeLock = null;
let generation = 0;  // listeners from an earlier connection ignore their events
let leaving = false, reconnecting = false;  // leaving: the user pressed Disconnect
let outbox = { eeg: [], events: [] }, flushing = false, serverOk = null;
// Every half-second batch goes into IndexedDB on the phone; when the page was loaded from the
// PC logger (http://localhost over USB), the batch is also sent there.
const PC_MODE = location.hostname === 'localhost';
let db = null, savedChunks = 0, localError = null;
let pcQueue = [];  // batches the PC logger hasn't confirmed yet
let quality = {};
let controlText = '';
let rateAt = 0;
let audio = null, tones = null;  // tones: { key, gain, oscs } of the sound playing now
let phase = null, testKey = null, testTimer = null, earTimer = null;
let warnedAt = null;  // when the last contact chime played; null while no warning is pending
let probeTimer = null, probe = null;  // probe: { at, firstTap, taps, timer } while a bell awaits its answer
let medSound = 0, probesOn = false, previewTimer = null;  // remembered on this phone between visits
try {
  medSound = Math.max(0, MED_SOUNDS.findIndex(([key]) => key === localStorage.getItem('medSound')));
  probesOn = localStorage.getItem('probes') === 'on';
} catch (err) { /* storage blocked: start from the defaults */ }

function stamp() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}-${p(d.getSeconds())}`;
}

function setStatus(text) { $('status').textContent = text; }

function logEvent(text) {
  outbox.events.push([Date.now(), text]);
  $('log').textContent = `${new Date().toLocaleTimeString()} ${text}\n` + $('log').textContent;
}

// A command is [length, ASCII..., '\n'], where length counts the text and the newline.
function encodeCommand(cmd) {
  const bytes = new TextEncoder().encode(`X${cmd}\n`);
  bytes[0] = bytes.length - 1;
  return bytes;
}

async function send(cmd) {
  await control.writeValue(encodeCommand(cmd));
}

// A 20-byte packet: uint16 big-endian packet index, then 12 samples of 12 bits.
function decodeEEG(dv) {
  const samples = new Array(12);
  for (let k = 0; k < 6; k++) {
    const b0 = dv.getUint8(2 + 3 * k), b1 = dv.getUint8(3 + 3 * k), b2 = dv.getUint8(4 + 3 * k);
    samples[2 * k] = 0.48828125 * (((b0 << 4) | (b1 >> 4)) - 2048);
    samples[2 * k + 1] = 0.48828125 * ((((b1 & 0xf) << 8) | b2) - 2048);
  }
  return samples;
}

function onControl(e) {
  const dv = e.target.value;
  const bytes = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
  controlText += new TextDecoder().decode(bytes.subarray(1, 1 + bytes[0]));
  let end;
  while ((end = controlText.indexOf('}')) >= 0) {
    logEvent(`control ${controlText.slice(0, end + 1).trim()}`);
    controlText = controlText.slice(end + 1);
  }
}

function onEEG(c, e) {
  const dv = e.target.value;
  const index = dv.getUint16(0);
  const samples = decodeEEG(dv);
  if (c.lastIndex !== null) {
    const gap = (index - c.lastIndex - 1) & 0xffff;
    if (gap < 1000) c.lost += gap;  // a bigger jump is a restart, not loss
  }
  c.lastIndex = index;
  c.packets++;
  for (const v of samples) {
    c.buf[c.pos] = v;
    c.pos = (c.pos + 1) % BUF;
    c.filled = Math.min(c.filled + 1, BUF);
  }
  outbox.eeg.push([Date.now(), c.name, index, ...samples.map(v => +v.toFixed(2))]);
}

function lastSamples(c, n) {
  const x = new Float32Array(n);
  for (let i = 0; i < n; i++) x[i] = c.buf[(c.pos - n + i + BUF) % BUF];
  return x;
}

// Hann-windowed DFT of the last 2 s: bin k is k * 0.5 Hz.
const NBINS = 129;
const hann = Float32Array.from({ length: WIN }, (_, i) => 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (WIN - 1)));
const cosT = Float32Array.from({ length: WIN }, (_, j) => Math.cos(2 * Math.PI * j / WIN));
const sinT = Float32Array.from({ length: WIN }, (_, j) => Math.sin(2 * Math.PI * j / WIN));
const PSCALE = 2 / (WIN * hann.reduce((a, w) => a + w * w, 0));  // summed bins -> mean square, µV²

function analyse(c) {
  const x = lastSamples(c, WIN);
  let mean = 0, railed = 0;
  for (const v of x) {
    mean += v;
    if (Math.abs(v) > RAIL) railed++;
  }
  mean /= WIN;
  for (let i = 0; i < WIN; i++) x[i] = (x[i] - mean) * hann[i];
  const power = new Float32Array(NBINS);
  for (let k = 1; k < NBINS; k++) {
    let re = 0, im = 0;
    for (let i = 0; i < WIN; i++) {
      const j = (k * i) % WIN;
      re += x[i] * cosT[j];
      im -= x[i] * sinT[j];
    }
    power[k] = re * re + im * im;
  }
  const sum = (lo, hi) => power.slice(lo * 2, hi * 2).reduce((a, b) => a + b, 0);
  const rms = (lo, hi) => Math.sqrt(PSCALE * sum(lo, hi));
  const total = sum(1, 30) || 1;
  return {
    power,
    bands: BANDS.map(([lo, hi]) => 100 * sum(lo, hi) / total),
    railed: railed / WIN,
    hum: rms(48, 52),
    noise: rms(20, 40),
  };
}

// Mains hum grows when a sensor sits loosely on the skin. 20-40 Hz noise is muscle tension or a
// poorly seated sensor: a well seated forehead sensor showed hum 1, noise 3.
const level = (v, fair, bad) => v > bad ? 2 : v > fair ? 1 : 0;
function contact(q) {
  if (q.railed > 0.01) return [2, 'no contact'];
  const hum = level(q.hum, HUM_FAIR, HUM_BAD), noise = level(q.noise, NOISE_FAIR, NOISE_BAD);
  if (!hum && !noise) return [0, 'ok'];
  return [Math.max(hum, noise), hum >= noise ? 'loose: press it on' : 'noisy: relax face or reseat'];
}

function render() {
  const now = performance.now();
  if (now - rateAt >= 2000) {
    for (const c of chans) {
      c.rate = (c.packets - c.counted) * 12 / ((now - rateAt) / 1000);
      c.counted = c.packets;
    }
    rateAt = now;
  }
  const ready = chans.every(c => c.filled >= WIN);
  const results = ready ? chans.map(analyse) : [];
  const verdicts = results.map(contact);
  if (ready) checkContact(verdicts.map(([lvl]) => lvl));
  $('contact').innerHTML = chans.map((c, ch) => {
    if (!ready) return `<div class="tile"><b>${c.name}</b>${PLACES[ch]}<small>waiting…</small></div>`;
    const r = results[ch];
    const [lvl, why] = verdicts[ch];
    quality[c.name] = `${VERDICT[lvl]} (hum ${r.hum.toFixed(0)}, noise ${r.noise.toFixed(0)})`;
    return `<div class="tile ${VERDICT[lvl]}"><b>${c.name}</b>${PLACES[ch]}<small>${VERDICT[lvl]}: ${why}<br>hum ${r.hum.toFixed(0)} · noise ${r.noise.toFixed(0)} µV</small></div>`;
  }).join('');
  $('rows').innerHTML = chans.map((c, ch) => {
    const head = `<td style="color:${COLORS[ch]}">${c.name}</td><td>${c.rate.toFixed(0)}</td><td>${c.lost}</td>`;
    if (!ready) return `<tr>${head}<td colspan="3">filling…</td></tr>`;
    return `<tr>${head}${results[ch].bands.map(b => `<td>${b.toFixed(0)}</td>`).join('')}</tr>`;
  }).join('');
  if (ready) drawSpectrum(results.map(r => r.power));
}

const HP = 1 / (1 + 2 * Math.PI * 1 / FS);  // one-pole high-pass at 1 Hz, so drift stays in its row

function drawTraces() {
  requestAnimationFrame(drawTraces);
  if (!session) return;
  const cv = $('traces'), g = cv.getContext('2d'), W = cv.width, H = cv.height;
  const rowH = H / chans.length;
  g.fillStyle = '#000';
  g.fillRect(0, 0, W, H);
  g.font = '22px sans-serif';
  chans.forEach((c, ch) => {
    const mid = rowH * (ch + 0.5);
    g.strokeStyle = '#333';
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(0, mid);
    g.lineTo(W, mid);
    g.stroke();
    if (c.filled < 2) return;
    const x = lastSamples(c, c.filled);
    g.strokeStyle = COLORS[ch];
    g.lineWidth = 1.5;
    g.beginPath();
    let y = 0;
    for (let i = 0; i < x.length; i++) {
      if (i) y = HP * (y + x[i] - x[i - 1]);
      const px = W - (x.length - 1 - i) * W / (BUF - 1);
      g.lineTo(px, mid - Math.max(-1, Math.min(1, y / TRACE_UV)) * rowH / 2);
    }
    g.stroke();
    g.fillStyle = COLORS[ch];
    g.fillText(c.name, 6, rowH * ch + 24);
  });
  g.fillStyle = '#888';
  g.fillText(`±${TRACE_UV} µV per row, last 4 s`, W - 270, H - 8);
}

function drawSpectrum(powers) {
  const cv = $('spectrum'), g = cv.getContext('2d'), W = cv.width, H = cv.height;
  const kMin = 2, kMax = 120;  // 1-60 Hz
  const xOf = k => (k - kMin) / (kMax - kMin) * W;
  let lo = Infinity, hi = -Infinity;
  for (const p of powers) for (let k = kMin; k <= kMax; k++) {
    const v = Math.log10(p[k] + 1e-9);
    lo = Math.min(lo, v);
    hi = Math.max(hi, v);
  }
  const yOf = v => H - 24 - (v - lo) / (hi - lo || 1) * (H - 34);
  g.fillStyle = '#000';
  g.fillRect(0, 0, W, H);
  g.fillStyle = '#223';
  g.fillRect(xOf(16), 0, xOf(26) - xOf(16), H - 24);  // alpha, 8-13 Hz
  g.fillStyle = '#888';
  g.font = '20px sans-serif';
  for (const f of [10, 20, 30, 40, 50]) g.fillText(f, xOf(2 * f) - 10, H - 4);
  g.fillText('Hz', W - 30, H - 4);
  powers.forEach((p, ch) => {
    g.strokeStyle = COLORS[ch];
    g.lineWidth = 2;
    g.beginPath();
    for (let k = kMin; k <= kMax; k++) g.lineTo(xOf(k), yOf(Math.log10(p[k] + 1e-9)));
    g.stroke();
  });
}

function beep(times) {
  audio ??= new AudioContext();
  for (let i = 0; i < times; i++) {
    const t = audio.currentTime + i * 0.3;
    const osc = audio.createOscillator(), gain = audio.createGain();
    osc.frequency.value = 880;
    gain.gain.value = 0.3;
    osc.connect(gain).connect(audio.destination);
    osc.start(t);
    osc.stop(t + 0.15);
  }
}

// A soft chime: sine notes that rise and fade smoothly, panned left (-1), centre (0) or right (1).
function chime(notes, pan, delay) {
  audio ??= new AudioContext();
  const panner = audio.createStereoPanner();
  panner.pan.value = pan;
  panner.connect(audio.destination);
  notes.forEach((freq, i) => {
    const t = audio.currentTime + delay + i * 0.3;
    const osc = audio.createOscillator(), gain = audio.createGain();
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.25, t + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    osc.connect(gain).connect(panner);
    osc.start(t);
    osc.stop(t + 0.5);
  });
}

// Fades the current tones out and the SOUNDS[key] tones in over `fade` seconds; key null means silence.
function playSound(key, fade) {
  if (!tones && !key) return;
  audio ??= new AudioContext();
  const t = audio.currentTime;
  if (tones) {
    const { gain, oscs } = tones;
    gain.gain.cancelScheduledValues(t);
    gain.gain.setValueAtTime(gain.gain.value, t);
    gain.gain.linearRampToValueAtTime(0, t + fade);
    for (const o of oscs) o.stop(t + fade + 0.05);
    tones = null;
  }
  if (!key) return;
  const merger = audio.createChannelMerger(2), gain = audio.createGain();
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(1, t + fade);
  merger.connect(gain).connect(audio.destination);
  if (!SOUNDS[key]) {
    const src = audio.createBufferSource();
    src.buffer = noiseBuffer(key);
    src.loop = true;
    src.connect(gain);
    src.start(t);
    tones = { key, gain, oscs: [src] };
    return;
  }
  const oscs = [];
  [SOUNDS[key].left, SOUNDS[key].right].forEach((freqs, ear) => {
    for (const f of freqs) {
      const osc = audio.createOscillator(), level = audio.createGain();
      osc.frequency.value = f;
      level.gain.value = TONE_GAIN / Math.sqrt(freqs.length);
      osc.connect(level).connect(merger, 0, ear);
      osc.start(t);
      oscs.push(osc);
    }
  });
  tones = { key, gain, oscs };
}

const noiseCache = {};

// A seamless stereo loop of white, pink or brown noise. Pink uses Paul Kellet's filter; brown is
// leaky-integrated white. The loop's tail is crossfaded into its head, so the seam doesn't click.
function noiseBuffer(kind) {
  if (noiseCache[kind]) return noiseCache[kind];
  const n = NOISE_S * audio.sampleRate, overlap = Math.round(0.5 * audio.sampleRate);
  const buffer = audio.createBuffer(2, n, audio.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const x = new Float32Array(n + overlap);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, last = 0;
    for (let i = 0; i < x.length; i++) {
      const w = Math.random() * 2 - 1;
      if (kind === 'pink') {
        b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759;
        b2 = 0.96900 * b2 + w * 0.1538520; b3 = 0.86650 * b3 + w * 0.3104856;
        b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
        x[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362;
        b6 = w * 0.115926;
      } else if (kind === 'brown') {
        last = (last + 0.02 * w) / 1.02;
        x[i] = last;
      } else {
        x[i] = w;
      }
    }
    for (let i = 0; i < overlap; i++) x[i] = x[i] * (i / overlap) + x[n + i] * (1 - i / overlap);
    const out = x.subarray(0, n);
    let mean = 0, sq = 0;
    for (const v of out) mean += v / n;
    for (const v of out) sq += (v - mean) ** 2 / n;
    const scale = NOISE_RMS / Math.sqrt(sq);
    buffer.getChannelData(ch).set(out.map(v => (v - mean) * scale));
  }
  return (noiseCache[kind] = buffer);
}

function soundLabel(key) {
  return SOUNDS[key] ? `${key} L${SOUNDS[key].left.join('+')} R${SOUNDS[key].right.join('+')}` : `${key} noise`;
}

// Steps to the next sound and plays a few seconds of it, so the choice can be heard.
function nextSound() {
  medSound = (medSound + 1) % MED_SOUNDS.length;
  const [key] = MED_SOUNDS[medSound];
  try { localStorage.setItem('medSound', key); } catch (err) { /* not remembered */ }
  showPhase();
  clearTimeout(previewTimer);
  playSound(key || null, 0.3);
  previewTimer = setTimeout(() => testKey === null && earTimer === null && playSound(null, 0.5), PREVIEW_S * 1000);
}

function toggleProbes() {
  probesOn = !probesOn;
  try { localStorage.setItem('probes', probesOn ? 'on' : 'off'); } catch (err) { /* not remembered */ }
  showPhase();
}

function checkContact(levels) {
  const now = performance.now();
  const longBad = [];
  levels.forEach((lvl, ch) => {
    const c = chans[ch];
    c.badSince = lvl === 2 ? c.badSince ?? now : null;
    if (c.badSince !== null && now - c.badSince >= WARN_AFTER_MS) longBad.push(ch);
  });
  if (testKey === null) return;
  if (longBad.length && (warnedAt === null || now - warnedAt >= WARN_EVERY_MS)) {
    longBad.forEach((ch, i) => chime(EAR_SENSOR[ch] ? [523, 392] : [880, 660], SIDES[ch], i * 0.9));
    logEvent(`contact warning ${longBad.map(ch => chans[ch].name).join(' ')}`);
    warnedAt = now;
  } else if (warnedAt !== null && !levels.includes(2)) {
    chime([523, 784], 0, 0);
    logEvent('contact ok');
    warnedAt = null;
  }
}

function setPhase(marker, block, total) {
  logEvent(`marker ${marker}`);
  phase = { marker, label: LABELS[marker], block, total, since: performance.now() };
  showPhase();
}

function showPhase() {
  for (const b of document.querySelectorAll('.marker')) b.classList.toggle('active', phase?.marker === b.dataset.marker);
  for (const b of document.querySelectorAll('.test')) {
    const mine = testKey === b.dataset.test;
    b.classList.toggle('active', mine);
    b.textContent = mine ? 'Stop test' : TESTS[b.dataset.test].label;
    b.disabled = !device?.gatt.connected || (testKey !== null && !mine);
  }
  $('earCheck').disabled = testKey !== null;
  $('earCheck').textContent = earTimer !== null ? 'Stop ear check' : 'Ear check';
  $('medSound').disabled = $('probes').disabled = testKey !== null;
  $('medSound').textContent = `Sound: ${MED_SOUNDS[medSound][1]}`;
  $('probes').textContent = `Probes: ${probesOn ? 'on' : 'off'}`;
  $('sit').hidden = testKey !== 'meditate';
  $('sitHelp').innerHTML = probesOn ? 'At the bell, tap anywhere:<br>1× focused · 2× mind wandering · 3× drowsy' : 'Eyes closed.';
  if (!phase) {
    $('phase').textContent = '';
    return;
  }
  const clock = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const s = Math.floor((performance.now() - phase.since) / 1000);
  const of = phase.total ? ` / ${clock(phase.total)}, block ${phase.block}` : '';
  $('phase').textContent = `${phase.label} · ${clock(s)}${of}`;
  $('sitClock').textContent = `${clock(s)} / ${clock(phase.total ?? 0)}`;
}

function scheduleProbe(first) {
  const [lo, hi] = PROBE_GAP_S;
  probeTimer = setTimeout(askProbe, (first ? PROBE_FIRST_S : lo + Math.random() * (hi - lo)) * 1000);
}

function askProbe() {
  chime([1047], 0, 0);
  logEvent('probe');
  probe = { at: performance.now(), firstTap: null, taps: 0, timer: setTimeout(answerProbe, PROBE_WAIT_MS) };
}

function tapProbe() {
  if (!probe) return;
  probe.firstTap ??= performance.now();
  probe.taps++;
  clearTimeout(probe.timer);
  probe.timer = setTimeout(answerProbe, TAP_GAP_MS);
}

// One soft tick per tap counted confirms the answer; more than three taps is logged as unclear.
function answerProbe() {
  const { at, firstTap, taps } = probe;
  probe = null;
  const answer = taps === 0 ? 'none' : ANSWERS[taps - 1] ?? 'unclear';
  const rt = firstTap === null ? '' : ` rt_ms=${Math.round(firstTap - at)}`;
  logEvent(`probe_answer ${answer} taps=${taps}${rt}`);
  if (taps) chime(Array(Math.min(taps, 4)).fill(1319), 0, 0);
  scheduleProbe(false);
}

function stopProbes() {
  clearTimeout(probeTimer);
  if (probe) clearTimeout(probe.timer);
  probeTimer = null;
  probe = null;
}

function runTest(key, step = 0) {
  const steps = TESTS[key].steps;
  if (step === steps.length) {
    beep(3);
    stopTest();
    return;
  }
  if (step === 0) stopEarCheck();
  const { marker, s, beeps = 0 } = steps[step];
  const sound = steps[step].sound === 'picked' ? MED_SOUNDS[medSound][0] || null : steps[step].sound ?? null;
  testKey = key;
  if (beeps) beep(beeps);
  testTimer = setTimeout(() => runTest(key, step + 1), s * 1000);
  setPhase(marker, `${step + 1} of ${steps.length}`, s);
  if (marker === 'meditate') {
    logEvent(`meditate sound ${sound ?? 'silence'} probes ${probesOn ? 'on' : 'off'}`);
    if (probesOn) scheduleProbe(true);
  }
  if (step === 0) clearTimeout(previewTimer);
  // A preview of the picked sound may already be playing: it carries on, but is still logged.
  if (sound !== (tones?.key ?? null)) playSound(sound, FADE_S);
  if (sound && sound !== (step ? steps[step - 1].sound ?? null : null)) logEvent(`sound ${soundLabel(sound)}`);
}

function stopTest() {
  if (testKey !== null) logEvent('marker test_end');
  clearTimeout(testTimer);
  stopProbes();
  testKey = null;
  testTimer = null;
  warnedAt = null;
  phase = null;
  playSound(null, 0.5);
  showPhase();
  showRecordings().catch(() => {});
}

function earCheck(i) {
  if (i === EAR_CHECK.length) {
    stopEarCheck();
    return;
  }
  const [key, label, s] = EAR_CHECK[i];
  playSound(key, 0.1);
  phase = { label: `Ear check: ${label}`, since: performance.now() };
  earTimer = setTimeout(() => earCheck(i + 1), s * 1000);
  showPhase();
}

function stopEarCheck() {
  if (earTimer === null) return;
  clearTimeout(earTimer);
  earTimer = null;
  playSound(null, 0.1);
  phase = null;
  showPhase();
}

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('muse', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('chunks', { autoIncrement: true }).createIndex('session', 'session');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function request(req) {
  return new Promise((resolve, reject) => {
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

const sessionIndex = mode => db.transaction('chunks', mode).objectStore('chunks').index('session');

function saveChunk(chunk) {
  return request(db.transaction('chunks', 'readwrite').objectStore('chunks').add(chunk));
}

function listSessions() {
  return new Promise((resolve, reject) => {
    const names = [];
    const req = sessionIndex('readonly').openKeyCursor(null, 'nextunique');
    req.onsuccess = () => {
      if (!req.result) return resolve(names);
      names.push(req.result.key);
      req.result.continue();
    };
    req.onerror = () => reject(req.error);
  });
}

function deleteSession(name) {
  return new Promise((resolve, reject) => {
    const index = sessionIndex('readwrite');
    const req = index.openCursor(IDBKeyRange.only(name));
    req.onsuccess = () => {
      if (!req.result) return;
      req.result.delete();
      req.result.continue();
    };
    index.objectStore.transaction.oncomplete = resolve;
    index.objectStore.transaction.onerror = () => reject(index.objectStore.transaction.error);
  });
}

// The same two CSV files the PC logger writes, so the analysis scripts read either.
async function sessionFiles(name) {
  const chunks = await request(sessionIndex('readonly').getAll(name));
  const cell = v => typeof v === 'string' && /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
  const eeg = ['t_ms,channel,index,' + Array.from({ length: 12 }, (_, i) => `s${i}`).join(',')];
  const events = ['t_ms,event'];
  for (const c of chunks) {
    for (const r of c.eeg) eeg.push(r.join(','));
    for (const r of c.events) events.push(r.map(cell).join(','));
  }
  return [
    new File([eeg.join('\n') + '\n'], `${name}_eeg.csv`, { type: 'text/csv' }),
    new File([events.join('\n') + '\n'], `${name}_events.csv`, { type: 'text/csv' }),
  ];
}

async function saveFiles(name) {
  for (const file of await sessionFiles(name)) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file);
    a.download = file.name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  }
}

async function shareFiles(name) {
  const files = await sessionFiles(name);
  if (!navigator.canShare?.({ files })) {
    setStatus('This phone cannot share files from here; use Save instead.');
    return;
  }
  await navigator.share({ files, title: name });
}

async function removeSession(name) {
  if (!confirm(`Delete ${name} from this phone?`)) return;
  await deleteSession(name);
  await showRecordings();
}

async function showRecordings() {
  if (!db) return;
  const box = $('recordings');
  const names = (await listSessions()).reverse();  // newest first
  const counts = await Promise.all(names.map(n => request(sessionIndex('readonly').count(n))));
  box.textContent = names.length ? '' : 'None yet.';
  names.forEach((name, i) => {
    const row = document.createElement('div');
    row.className = 'rec';
    const label = document.createElement('span');
    label.textContent = `${name} · ${(counts[i] / 120).toFixed(1)} min`;
    row.append(label);
    for (const [text, action] of [['Save', saveFiles], ['Share', shareFiles], ['Delete', removeSession]]) {
      const b = document.createElement('button');
      b.className = 'secondary small';
      b.textContent = text;
      b.onclick = () => action(name).catch(err => setStatus(`${text} failed: ${err.message}`));
      row.append(b);
    }
    box.append(row);
  });
}

async function flush() {
  if (flushing || !session) return;
  flushing = true;
  if (outbox.eeg.length || outbox.events.length) {
    const batch = { session, ...outbox };
    outbox = { eeg: [], events: [] };
    try {
      await saveChunk(batch);
      savedChunks++;
      localError = null;
      if (PC_MODE) pcQueue.push(batch);
    } catch (err) {
      // Keep the data and retry on the next tick.
      outbox = { eeg: batch.eeg.concat(outbox.eeg), events: batch.events.concat(outbox.events) };
      localError = err.message;
    }
  }
  try {
    while (pcQueue.length) {
      const r = await fetch('/log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ quality, ...pcQueue[0] }),
      });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      pcQueue.shift();
    }
    serverOk = true;
  } catch (err) {
    serverOk = false;
  }
  flushing = false;
  const local = localError ? `NOT saving on the phone: ${localError}` : `Saved on the phone: ${(savedChunks / 120).toFixed(1)} min`;
  const pc = !PC_MODE ? '' : serverOk ? ' · PC: saving' : ` · PC: unreachable, ${pcQueue.length} batches waiting`;
  $('server').textContent = local + pc;
}

async function keepAwake() {
  try {
    wakeLock = await navigator.wakeLock.request('screen');
  } catch (err) {
    logEvent(`no wake lock: ${err.message}`);
  }
}

function setConnected(on) {
  $('connect').disabled = on;
  $('disconnect').disabled = !on;
  for (const b of document.querySelectorAll('.marker')) b.disabled = !on;
  showPhase();
  // A new session shows up in the list once its first batch is saved.
  setTimeout(() => showRecordings().catch(() => {}), on ? 2000 : 0);
}

async function connect() {
  if (!navigator.bluetooth) {
    setStatus('No Web Bluetooth here. Use Chrome on Android, with the page opened from its https address or from http://localhost via phone_run.sh.');
    return;
  }
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE] }, { namePrefix: 'Muse' }],
      optionalServices: [SERVICE],
    });
    device.ongattserverdisconnected = onDisconnected;
    leaving = false;
    setStatus(`Connecting to ${device.name}…`);
    session = stamp();
    quality = {};
    savedChunks = 0;
    for (const c of chans) Object.assign(c, { pos: 0, filled: 0, lastIndex: null, packets: 0, counted: 0, lost: 0, rate: 0, badSince: null });
    rateAt = performance.now();
    logEvent(`connected ${device.name}`);
    await startStream();
    setConnected(true);
    await keepAwake();
    setStatus(`Streaming from ${device.name}, session ${session}.`);
  } catch (err) {
    setStatus(`Failed: ${err.message}`);
    logEvent(`error ${err.name}: ${err.message}`);
  }
}

// Connects to the headband, subscribes to the control and EEG characteristics and starts the stream.
async function startStream() {
  const gen = ++generation;
  const service = await (await device.gatt.connect()).getPrimaryService(SERVICE);
  control = await service.getCharacteristic(CONTROL);
  control.addEventListener('characteristicvaluechanged', e => gen === generation && onControl(e));
  await control.startNotifications();
  for (const [ch, [, id]] of EEG.entries()) {
    const char = await service.getCharacteristic(id);
    char.addEventListener('characteristicvaluechanged', e => gen === generation && onEEG(chans[ch], e));
    await char.startNotifications();
  }
  // muse-js's start sequence: halt, preset 21 (4 EEG channels, no aux), status, resume.
  for (const cmd of ['h', 'p21', 's', 'd']) await send(cmd);
  await send('v1');  // the reply carries the firmware version
}

// After an unexpected drop the test and its sound keep running while this wins the link back;
// the analysis skips the gap. Three falling notes mean lost, three rising notes mean back.
async function reconnect() {
  if (reconnecting) return;
  reconnecting = true;
  chime([392, 330, 262], 0, 0);
  for (let attempt = 1; !leaving && !device.gatt.connected; attempt++) {
    for (const c of chans) c.lastIndex = null;  // the packet index may restart
    try {
      await startStream();
      if (leaving) device.gatt.disconnect();  // Disconnect was pressed during the attempt
      logEvent(`reconnected after ${attempt} attempt(s)`);
      chime([262, 330, 392], 0, 0);
      setStatus(`Streaming from ${device.name}, session ${session} (reconnected).`);
    } catch (err) {
      logEvent(`reconnect attempt ${attempt} failed: ${err.message}`);
      await new Promise(r => setTimeout(r, 2000));
    }
  }
  reconnecting = false;
}

async function disconnect() {
  leaving = true;
  if (!device.gatt.connected) {
    onDisconnected();  // mid-reconnect: there is no link left to close
    return;
  }
  try { await send('h'); } catch (err) { /* already gone */ }
  device.gatt.disconnect();
}

function onDisconnected() {
  logEvent('disconnected');
  if (!leaving) {
    setStatus(`Connection lost at ${new Date().toLocaleTimeString()}, reconnecting…`);
    reconnect();
    return;
  }
  setStatus(`Disconnected. Session ${session} is saved on the phone.`);
  stopTest();
  setConnected(false);
  wakeLock?.release().catch(() => {});
  wakeLock = null;
}

$('connect').onclick = connect;
$('disconnect').onclick = disconnect;
$('earCheck').onclick = () => earTimer !== null ? stopEarCheck() : earCheck(0);
for (const b of document.querySelectorAll('.test')) b.onclick = () => testKey !== null ? stopTest() : runTest(b.dataset.test);
for (const b of document.querySelectorAll('.marker')) b.onclick = () => phase?.marker !== b.dataset.marker && setPhase(b.dataset.marker);
$('sit').onpointerdown = e => e.target !== $('sitStop') && tapProbe();
$('sitStop').onclick = stopTest;
$('medSound').onclick = nextSound;
$('probes').onclick = toggleProbes;
document.addEventListener('visibilitychange', () => {
  if (!device?.gatt.connected) return;
  if (document.visibilityState === 'visible') keepAwake();
  else logEvent('page hidden: Chrome may pause the stream');
});
setInterval(() => { flush(); showPhase(); if (session) render(); }, 500);
requestAnimationFrame(drawTraces);
openDb()
  .then(d => { db = d; return showRecordings(); })
  .catch(err => setStatus(`Recordings can't be kept on this phone: ${err.message}`));
navigator.storage?.persist?.();  // ask Chrome not to clear the recordings when space runs low
navigator.serviceWorker?.register('sw.js').catch(() => {});
</script>
</body>
</html>
